# ============================================================================
# DROP RULES - Threats to block actively (alert → drop)
# ============================================================================
# Rules listed here are converted from "alert" to "drop" by suricata-update.
# In IDS mode, DROP actions do not discard packets directly.
# suridata.sh reads these alerts and blocks external IPs through iptables.
#
# SYNTAX:
#   #2014939  # Commented SID = Rule remains as ALERT (not dropped)
#   2014939   # Uncommented SID = Rule is converted to DROP (DROP action selected)
#
# WARNING: Only add SIDs you are confident about. A false positive here
# may cause suridata.sh to block legitimate external IPs.
# ============================================================================

# ============================================================================
# TOR / ANONYMIZATION NETWORKS
# ============================================================================
re:ET TOR Known Tor
#
# ============================================================================
# TORRENT
# ============================================================================
re:ET P2P BitTorrent
re:ET P2P Vuze
re:GPL P2P BitTorrent
#
# ============================================================================
# BLOCKCHAIN / CRYPTO
# ============================================================================
re:ET INFO BitCoin
re:ET INFO Blockchain
re:ET INFO Observed Blockchain
re:ET INFO Ethereum
re:ET INFO Observed DNS Query to Blockchain RPC Domain
re:ET INFO poclbm BitCoin miner
re:ET COINMINER
#
# ============================================================================
# MALWARE / PHISHING
# ============================================================================
re:ET MALWARE
re:ET PHISHING
#
# ============================================================================
# NETWORK REPUTATION (INBOUND)
# ============================================================================
re:ET DROP Spamhaus DROP
#
# ============================================================================
# CUSTOM RULES - Add your own below
# ============================================================================
2028651 # ET USER_AGENTS Steam HTTP Client User-Agent - Corporate policy violation
2019102 # ET DOS Possible SSDP Amplification Scan in Progress
2014169 # ET DNS Query for .su TLD (Soviet Union) Often Malware Related
2014939 # ET INFO DNS Query for TOR Hidden Domain .onion Accessible Via TOR
#
# ============================================================================
# NOTES:
# - Test after changes: sudo bash /etc/suricata/suricataupdate.sh
# - Verify drop applied: grep "2014939" /var/lib/suricata/rules/suricata.rules
# - Verify firewall blocks separately; a DROP rule alone does not enforce IDS blocking.
# ============================================================================
