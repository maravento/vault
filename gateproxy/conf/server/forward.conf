server:
    interface: 127.0.0.1
    interface: 192.168.0.10
    
    module-config: "validator iterator"

    access-control: 127.0.0.0/8 allow
    access-control: 192.168.0.0/24 allow

    num-threads: 4

    msg-cache-size: 128m
    rrset-cache-size: 256m

    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4

    prefetch: yes
    prefetch-key: yes
    serve-expired: yes

    rrset-roundrobin: yes

    cache-min-ttl: 60
    cache-max-ttl: 86400

    outgoing-range: 2048
    num-queries-per-thread: 1024

    so-rcvbuf: 4m
    so-sndbuf: 4m

forward-zone:
    name: "."
    forward-addr: 8.8.8.8
    forward-addr: 8.8.4.4
